<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Login - Firebase 10.12.0</title>
    <!-- Firebase CDN Compat V10.12.0 -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        .hidden { display: none; }
        .toggle { color: #007bff; cursor: pointer; font-size: 0.9rem; margin-top: 10px; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="form-title">Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <select id="role" class="hidden">
            <option value="Karyawan">Karyawan</option>
            <option value="Owner">Owner</option>
        </select>
        <button id="auth-btn">Masuk</button>
        <span id="auth-toggle" class="toggle">Belum punya akun? Daftar</span>
    </div>

    <!-- Script Utama (Link to external script) -->
    <script src="script.js"></script>
</body>
</html>
